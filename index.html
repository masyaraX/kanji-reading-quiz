<!DOCTYPE html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漢字読み取りトレーニング</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5ff;color:#1d3050;font:16px system-ui,"Hiragino Kaku Gothic ProN",sans-serif}header{padding:32px 18px;background:#213a7b;color:white}header div,main{max-width:820px;margin:auto}h1{margin:5px 0}main{padding:16px}.box{background:white;padding:22px;border-radius:17px;margin:16px 0;box-shadow:0 4px 18px #15264212}label{display:inline-block;margin:8px}select,input{padding:13px;border:1px solid #aebeda;border-radius:10px;font:inherit}button{font:inherit;background:#3c57b4;color:#fff;border:0;border-radius:10px;padding:13px 19px;cursor:pointer;font-weight:bold}button:disabled{opacity:.7;cursor:default}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{background:#eaf0ff;color:#213f88;text-align:left}.choices button.right{background:#bcecd2;color:#095833}.choices button.wrong{background:#ffd9df;color:#852733}#word{font-size:clamp(34px,7vw,56px);font-weight:800;margin:30px 0}#feedback{font-weight:bold;min-height:32px;margin:14px 0}#next{display:none}#score{font-weight:bold}@media(max-width:520px){.choices{grid-template-columns:1fr}} </style><header><div><small>論理・漢字マスター｜p.190〜197</small><h1>漢字読み取りトレーニング</h1>入力モード／4択モード ・ 全87問</div></header><main><section class="box"><label>ページ <select id="page"><option value="all">すべて</option><option>190</option><option>191</option><option>192</option><option>193</option><option>194</option><option>195</option><option>196</option><option>197</option></select></label><label>出題数 <select id="count"><option>10</option><option>20</option><option value="all">全問</option></select></label><label>解答方法 <select id="mode"><option value="choice">4択モード</option><option value="input">入力モード</option></select></label><label><input type="checkbox" id="shuffle" checked> ランダム</label><button id="start">開始する</button></section><section class="box"><span id="score">開始ボタンを押してください</span><div id="word">漢字クイズ</div><div id="answer"></div><p id="feedback" role="status"></p><button id="next">次へ →</button></section><p>教科書写真から確認できた87語を収録した練習版です。学習進捗はこの端末のみに保存します。</p></main><script>const raw="190:形而上/けいじじょう 190:私淑/ししゅく 190:倫理/りんり 190:灌漑/かんがい 190:煽る/あおる 190:囲繞/いにょう 190:解釈/かいしゃく 190:全貌/ぜんぼう 190:暗暗裡/あんあんり 191:術/すべ 191:空隙/くうげき 191:切り拓く/きりひらく 191:普及/ふきゅう 191:一端/いったん 191:一目瞭然/いちもくりょうぜん 191:象って/かたどって 191:至難/しなん 191:怠った/おこたった 191:支払い/しはらい 191:流石/さすが 192:竣工/しゅんこう 192:禍根/かこん 192:秘匿/ひとく 192:概ね/おおむね 192:地縁/ちえん 192:豪奢/ごうしゃ 192:安穏/あんのん 192:鑑みる/かんがみる 192:根回し/ねまわし 192:詮索/せんさく 192:渉猟/しょうりょう 193:不協和音/ふきょうわおん 193:虐げられて/しいたげられて 193:畏怖/いふ 193:爛熟/らんじゅく 193:袋小路/ふくろこうじ 193:多面的/ためんてき 193:稀代/きだい 193:凌駕/りょうが 193:画する/かくする 193:矮小化/わいしょうか 193:直筆/じきひつ 193:超克/ちょうこく 194:蒙って/こうむって 194:検討/けんとう 194:繁栄/はんえい 194:弄し/ろうし 194:優雅/ゆうが 194:残滓/ざんし 194:捨象/しゃしょう 194:彫刻/ちょうこく 195:浸透/しんとう 195:肝心/かんじん 195:是非/ぜひ 195:散逸/さんいつ 195:山河/さんが 195:編纂/へんさん 195:雖も/いえども 195:斡旋/あっせん 195:日常茶飯事/にちじょうさはんじ 195:改修/かいしゅう 195:卓見/たっけん 195:陥れる/おとしいれる 196:漸進/ぜんしん 196:育む/はぐくむ 196:軽妙洒脱/けいみょうしゃだつ 196:彫琢/ちょうたく 196:憑依/ひょうい 196:顕す/あらわす 196:進捗/しんちょく 196:拙劣/せつれつ 196:寓話/ぐうわ 196:飢渇/きかつ 196:迂遠/うえん 196:礎/いしずえ 197:嚆矢/こうし 197:遡って/さかのぼって 197:透過/とうか 197:肥沃/ひよく 197:惨禍/さんか 197:謳歌/おうか 197:頻出/ひんしゅつ 197:否/いな 197:嫉妬/しっと 197:通暁/つうぎょう 197:台詞/せりふ 197:信仰/しんこう";const DATA=raw.split(' ').map(r=>{const [p,a]=r.split(':');const [word,answer]=a.split('/');return {page:p,word,answer}});const $=id=>document.getElementById(id);let list=[],idx=0,good=0,used=[];const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const norm=x=>(x||'').normalize('NFKC').trim().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));function begin(){list=DATA.filter(x=>$('page').value==='all'||x.page===$('page').value);if($('shuffle').checked)shuffle(list);if($('count').value!=='all')list=list.slice(0,+$('count').value);idx=good=0;used=[];show()}function show(){if(idx>=list.length){$('score').textContent='結果：'+good+'/'+list.length+' 問正解（'+Math.round(100*good/list.length)+'％）';$('word').textContent='終了！';$('answer').replaceChildren();$('feedback').textContent='もう一度練習するには開始を押してください。';$('next').style.display='none';return}let q=list[idx];$('score').textContent=(idx+1)+' / '+list.length+'　正解：'+good+'　p.'+q.page;$('word').textContent=q.word;$('answer').replaceChildren();$('feedback').textContent='';$('next').style.display='none';const box=$('answer');if($('mode').value==='choice'){box.className='choices';let alternatives=shuffle([...new Set(DATA.filter(x=>x.answer!==q.answer).map(x=>x.answer))]).slice(0,3);shuffle(alternatives=[q.answer,...alternatives]).forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>judge(v);box.append(b)})}else{box.className='';const input=document.createElement('input');input.placeholder='ひらがなで入力';input.id='typed';input.onkeydown=e=>{if(e.key==='Enter')judge(input.value)};box.append(input);const b=document.createElement('button');b.textContent='答え合わせ';b.onclick=()=>judge(input.value);box.append(b);input.focus()}}function judge(v){if(used[idx]||!norm(v))return;used[idx]=true;const q=list[idx];const ok=norm(v)===norm(q.answer);if(ok)good++;$('feedback').textContent=(ok?'✅ 正解！':'❌ 不正解。')+' 正しい読み：'+q.answer;$('answer').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('right');else if(b.textContent===v)b.classList.add('wrong')});const t=$('typed');if(t)t.disabled=true;$('next').style.display='inline-block'}$('start').onclick=begin;$('next').onclick=()=>{idx++;show()};</script></html>
